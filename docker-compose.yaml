version: "3"

services:
  db:
    image: postgres:16
    container_name: gantt-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: gantt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: gantt-go-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://user:pass@db:5432/gantt?sslmode=disable"
      PORT: "8080"
    depends_on:
      - db

volumes:
  pgdata:
